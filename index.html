<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bitácora de Hierro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav" id="nav" hidden><div class="nav-in"><div class="nav-l" id="navL"></div><div class="nav-t" id="navT"></div><div class="nav-r" id="navR"></div></div></header>
<div id="prog" class="prog" hidden aria-hidden="true"></div>
<main id="page"><div class="spin" aria-label="Cargando"></div></main>
<nav class="tabbar" id="tabbar" aria-label="Secciones" hidden><div id="tabs"></div></nav>
<div id="mini" class="minibar" hidden role="timer"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
/* Si la app no arranca en 12 s, muestra opciones para reintentar o reparar (no depende de app.js) */
window.__bhErrs = [];
window.addEventListener('error', function (e) { window.__bhErrs.push((e.message || 'error') + ' · ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
window.addEventListener('unhandledrejection', function (e) { window.__bhErrs.push('promesa: ' + ((e.reason && e.reason.message) || e.reason)); });
window.__bhRepair = function () {
  var done = function () { location.reload(); }, p = [];
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches && caches.keys) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(p).then(done, done);
  } catch (e) { done(); }
};
window.__bhStuck = function (title, detail) {
  var pg = document.getElementById('page'); if (!pg) return;
  pg.innerHTML = '<div class="stuck"><b>' + title + '</b><p>' + detail + '</p><button class="btn" onclick="location.reload()">Reintentar</button><button class="btn gray" onclick="__bhRepair()">Reparar y recargar</button><small></small></div>';
  pg.querySelector('small').textContent = (window.__bhErrs || []).slice(-3).join(' | ');
};
setTimeout(function () { if (document.querySelector('#page .spin')) window.__bhStuck('Está tardando más de lo normal', 'Puede ser mala señal, una versión vieja guardada en el teléfono o que tu proyecto de Supabase esté pausado (entra a supabase.com y mira si dice «Paused»). «Reparar y recargar» borra solo la copia de la app, no tus datos.'); }, 12000);
</script>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="catalog.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
